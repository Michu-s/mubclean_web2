<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - MubClean</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,300;400;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        :root {
            /* Colors from mp_theme.dart & Design System */
            --primary-blue: #1565C0;
            --primary-dark: #0D47A1;
            --primary-light: #E3F2FD;
            --secondary-teal: #10B981;

            --bg-scaffold: #FFFFFF;
            --bg-surface: #FFFFFF;
            --bg-alt: #F8FAFC;

            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-light: #94A3B8;
            --text-white: #FFFFFF;

            --border-light: #E2E8F0;

            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-glow: 0 0 20px rgba(21, 101, 192, 0.15);

            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 32px;
            --radius-full: 9999px;

            --font-display: 'Fraunces', serif;
            --font-body: 'Inter', sans-serif;
        }

        /* Doodles & Backgrounds */
        .bg-doodle-1 {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%231565C0' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .doodle-shape {
            position: absolute;
            z-index: -1;
            opacity: 0.6;
            pointer-events: none;
        }

        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-alt);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1,
        h2,
        h3 {
            font-family: var(--font-display);
            line-height: 1.2;
            color: var(--text-primary);
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Buttons matching landing */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 8px;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-dark));
            color: var(--text-white);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        .btn-primary:disabled {
            background: var(--text-light);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-block {
            width: 100%;
        }

        /* Header matching landing */
        header {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-light);
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 24px;
            color: var(--primary-blue);
        }

        /* Form Specific Styles */
        .register-section {
            padding: 60px 0 100px;
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at top right, rgba(21, 101, 192, 0.05), transparent 40%),
                radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.05), transparent 40%);
        }

        .form-card {
            background: var(--bg-surface);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-light);
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .form-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .form-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-label span.required {
            color: #ef4444;
            margin-left: 2px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 16px;
            transition: all 0.2s;
            color: var(--text-primary);
            background: #F8FAFC;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            background: white;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .form-note {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 16px;
            text-align: center;
        }

        .access-data-section {
            background-color: var(--primary-light);
            padding: 24px;
            border-radius: var(--radius-md);
            margin-bottom: 32px;
            border: 1px solid rgba(21, 101, 192, 0.1);
        }

        .access-data-section h3 {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Footer */
        footer {
            background: #0F172A;
            color: var(--text-light);
            padding: 80px 0 32px;
        }

        .copyright {
            padding-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @media (max-width: 600px) {
            .form-card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">
                <span class="material-icons-round" style="color: var(--primary-blue);">cleaning_services</span>
                MubClean
            </a>
            <a href="index.html"
                style="font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px;">
                <span class="material-icons-round" style="font-size: 18px;">arrow_back</span>
                Volver al inicio
            </a>
        </div>
    </header>

    <section class="register-section">
        <div class="container">

            <div class="form-card animate-in">
                <div class="form-header">
                    <div style="display: flex; justify-content: center; margin-bottom: 16px;">
                        <span class="material-icons-round"
                            style="font-size: 48px; color: var(--primary-blue); background: var(--primary-light); padding: 12px; border-radius: 16px;">account_circle</span>
                    </div>
                    <h1>Crea tu Cuenta</h1>
                    <p>Comienza a digitalizar tu negocio hoy mismo.</p>
                </div>

                <form id="registroForm">

                    <div class="access-data-section">
                        <h3>
                            <span class="material-icons-round">lock</span>
                            Datos de Acceso
                        </h3>
                        <div class="form-group">
                            <label for="email" class="form-label">Correo Electrónico <span
                                    class="required">*</span></label>
                            <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="password" class="form-label">Contraseña <span class="required">*</span></label>
                            <input type="password" id="password" name="password" class="form-input"
                                placeholder="Mínimo 6 caracteres" minlength="6" required>
                        </div>
                        <div class="form-group">
                            <label for="confirm_password" class="form-label">Confirmar Contraseña <span
                                    class="required">*</span></label>
                            <input type="password" id="confirm_password" name="confirm_password" class="form-input"
                                placeholder="Repite tu contraseña" minlength="6" required>
                        </div>
                    </div>

                    <button type="submit" id="btnSubmit" class="btn btn-primary btn-block">
                        Crear Cuenta
                        <span class="material-icons-round">arrow_forward</span>
                    </button>

                    <p class="form-note">
                        Al continuar, aceptas nuestros términos y condiciones.
                    </p>

                </form>
            </div>

        </div>

        <svg class="doodle-shape" width="300" height="300" viewBox="0 0 500 500"
            style="top: 100px; left: -50px; color: var(--primary-blue); opacity: 0.05;">
            <circle cx="250" cy="250" r="250" fill="currentColor" />
        </svg>
    </section>

    <footer>
        <div class="container">
            <div class="logo" style="color: white; margin-bottom: 24px; justify-content: center;">
                <span class="material-icons-round">cleaning_services</span>
                MubClean
            </div>
            <div class="copyright" style="border-top: none; padding-top: 0;">
                &copy; 2026 MubClean. Todos los derechos reservados.
            </div>
        </div>
    </footer>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://wtlitcaiboefcujqrmrg.supabase.co';
        const supabaseKey = 'sb_publishable_ZE7_csZsdp62HMNIocfbWQ_ogId0bVq';
        const supabase = createClient(supabaseUrl, supabaseKey);

        const form = document.getElementById('registroForm');
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = 'Creando Cuenta...';
            btnSubmit.disabled = true;

            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm_password').value;

                if (password !== confirmPassword) {
                    throw new Error('Las contraseñas no coinciden.');
                }

                // SignUp
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) throw error;

                if (data.user) {
                    // Auto-sign in usually happens, but we redirect immediately
                    window.location.href = 'detalles_negocio.html';
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Error: ' + error.message);
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>

</html>
